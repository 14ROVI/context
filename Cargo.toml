[package]
name = "context"
version = "0.3.0"
edition = "2024"
description = "A desktop assistant that brings relevant information into view."
license-file = "LICENSE"
publish = false

# Every dependency below is cross-platform. Tauri, `keyring`, `notify-rust` and
# `xcap` choose their own Windows, macOS or Linux backend, so Context itself
# barely branches on the target OS.
[dependencies]
async-channel = "2"
base64 = "0.22"
chrono = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ocrs = "0.14"
open = "5"
notify-rust = "4"
openidconnect = { version = "4.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rten = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tempfile = "3"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
which = "8"
xcap = "0.9.10"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
