# Builds Context for Windows, macOS and Linux on demand. Run it from the
# Actions tab or with `gh workflow run release.yml`. Each run uploads the
# bundles as artifacts; with "publish" set, it also creates a GitHub release
# for the version in tauri.conf.json, tagged at the commit that was built.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release with the bundles
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            bundle: target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            args: --bundles app,dmg --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-24.04
            args: --bundles deb,rpm,appimage
            bundle: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libx11-dev libxcb1-dev libxrandr-dev \
            libegl-dev libgbm-dev rpm

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version tauri.conf.json)" >> "$GITHUB_OUTPUT"

      # Automatic cards read text locally with the ocrs models, which the
      # bundles include. They are not in git; download and pin them here.
      - name: Download text recognition models
        run: |
          mkdir -p models
          check() { if command -v sha256sum >/dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi; }
          while read -r hash name; do
            curl -fsSL "https://ocrs-models.s3-accelerate.amazonaws.com/$name" -o "models/$name"
            echo "$hash  models/$name" | check
          done <<'EOF'
          a917b23dbd9524b465df7e922641b3ff2981623df4ded5a0234004ef2fee7cfe text-detection.onnx
          86c145c2edb96c8caed5b1ebb8f44d706408922211451c309c625157dd6061c5 text-recognition.onnx
          EOF

      # The Tauri CLI bundles the app. The pages in ui/ need no build step.
      # Context's Google OAuth client is compiled in from repository secrets. Builds
      # without them still work; Google Calendar is just unavailable.
      - name: Build bundles
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
        env:
          CONTEXT_GOOGLE_CLIENT_ID: ${{ secrets.CONTEXT_GOOGLE_CLIENT_ID }}
          CONTEXT_GOOGLE_CLIENT_SECRET: ${{ secrets.CONTEXT_GOOGLE_CLIENT_SECRET }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: Context-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version tauri.conf.json)
          gh release create "v$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "Context $version" \
            --notes "Context $version for Windows, macOS (universal) and Linux. The builds are not code-signed yet: Windows SmartScreen may warn before the installer runs, and on macOS you may need to right-click the app and choose Open, or allow it under System Settings > Privacy & Security."
