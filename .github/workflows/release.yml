# Builds the Windows installer on demand. Run it from the Actions tab or with
# `gh workflow run release.yml`. Each run uploads the installer as an artifact;
# with "publish" set, it also creates a draft GitHub release for the version
# in tauri.conf.json.
name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft GitHub release with the installer
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      # Automatic cards read text locally with the ocrs models, which the
      # installer bundles. They are not in git; download and pin them here.
      - name: Download text recognition models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $models = @{
            "text-detection.onnx"   = "A917B23DBD9524B465DF7E922641B3FF2981623DF4DED5A0234004EF2FEE7CFE"
            "text-recognition.onnx" = "86C145C2EDB96C8CAED5B1EBB8F44D706408922211451C309C625157DD6061C5"
          }
          foreach ($name in $models.Keys) {
            Invoke-WebRequest "https://ocrs-models.s3-accelerate.amazonaws.com/$name" -OutFile "models/$name"
            $hash = (Get-FileHash "models/$name" -Algorithm SHA256).Hash
            if ($hash -ne $models[$name]) { throw "$name has hash $hash, expected $($models[$name])" }
          }

      # The Tauri CLI bundles the installer. The pages in ui/ need no build step.
      # Context's own OAuth apps are compiled in from repository secrets. Builds
      # without them still work; those sign-ins are just unavailable.
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        env:
          CONTEXT_GOOGLE_CLIENT_ID: ${{ secrets.CONTEXT_GOOGLE_CLIENT_ID }}
          CONTEXT_GOOGLE_CLIENT_SECRET: ${{ secrets.CONTEXT_GOOGLE_CLIENT_SECRET }}
          CONTEXT_GITHUB_CLIENT_ID: ${{ secrets.CONTEXT_GITHUB_CLIENT_ID }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Context-${{ steps.version.outputs.version }}-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create draft release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release create "v$env:VERSION" $installer.FullName `
            --draft --title "Context $env:VERSION" `
            --notes "Windows installer for Context $env:VERSION. The installer is not code-signed yet, so Windows SmartScreen may warn before it runs."
